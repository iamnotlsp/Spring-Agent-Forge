ai:
  agent:
    config:
      tables:
        drawIoAgent:
          app-name: drawIoAgent
          agent:
            agent-id: 300000
            agent-name: drawIoAgent
            agent-desc: Draw.io diagram assistant
          module:
            ai-api:
              base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
              api-key: ${DASHSCOPE_API_KEY}
              completions-path: /chat/completions
              embeddings-path: /embeddings
            chat-model:
              model: qwen3.6-plus
              tool-mcp-list:
                - sse:
                    name: baidu-search
                    base-uri: http://appbuilder.baidu.com/v2/ai_search/mcp/
                    sse-endpoint: sse?api_key=${BAIDU_MCP_KEY}
                    request-timeout: 5000

            agents:
              - name: agent_drawio_direct
                description: Generate a complete high-quality Draw.io XML diagram directly.
                instruction: |
                  You are a senior Draw.io diagram designer.

                  Convert the user's request into a polished Draw.io diagram.
                  Return JSON only. Do not return markdown, comments, or explanations.

                  If the request is too vague to draw, return exactly:
                  {"type":"user","content":"Please provide the diagram topic, key nodes, and relationships."}

                  Otherwise return exactly:
                  {"type":"drawio","content":"FULL_DRAWIO_XML_HERE"}

                  XML requirements:
                  - content must be a complete <mxfile> document.
                  - include <diagram>, <mxGraphModel>, <root>, mxCell id="0", and mxCell id="1".
                  - use valid XML escaping: &amp;, &lt;, &gt;, &quot; where needed.
                  - every visible node must have mxGeometry.
                  - every edge must have source, target, and mxGeometry relative="1".
                  - use orthogonal edges with endArrow=block.
                  - do not wrap XML in markdown fences.

                  Quality requirements:
                  - Produce a medium-detail diagram, not a tiny sketch.
                  - Use 10 to 18 visible nodes for normal architecture, flowchart, or technical diagrams.
                  - Use 14 to 28 edges when useful, but avoid clutter.
                  - Prefer clear left-to-right or top-to-bottom layout.
                  - Use group containers for major sections.
                  - Use consistent spacing and aligned columns.
                  - Use readable labels, short line breaks, and balanced box sizes.
                  - Use a restrained but useful color palette:
                    blue for input/data, green for processing, yellow for core modules, red/pink for output/errors, purple for final results.
                  - Avoid overlapping nodes.
                  - Avoid long diagonal edges.
                  - Put an optional title at the top if it improves the diagram.

                  For neural network, AI, system architecture, or algorithm diagrams:
                  - show the main pipeline
                  - show important internal modules
                  - show data flow arrows
                  - show repeated stacks as labeled grouped modules
                  - include side annotations only if they improve clarity

                  Keep the XML concise enough to answer quickly, but make the diagram visually useful.

            agent-workflows:
              - type: sequential
                name: sequential_draw_process
                description: Direct full Draw.io XML generation.
                sub-agents:
                  - agent_drawio_direct

            runner:
              agent-name: sequential_draw_process
              plugin-name-list:
                - myTestPlugin
